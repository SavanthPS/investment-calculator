<form>
    <div class="input-group">
        <p>
            <label for="initial-investment">Initial Investment:</label>
            <input type="number" id="initial-investment" name="initial-investment"
                [(ngModel)]="enteredInitialInvestment" required>
        </p>
        <p>
            <label for="annual-investment">Annual Investment:</label>
            <input type="number" id="annual-investment" name="annual-investment" [(ngModel)]="enteredAnnualInvestment"
                required>
        </p>
    </div>
    <div class="onSubmitinput-group">
        <p>
            <label for="expected-return">Expected Return (%):</label>
            <input type="number" id="expected-returnonSubmit" name="expected-return" [(ngModel)]="enteredExpectedReturn"
                required>
        </p>
        <p>
            <label for="duration">Duration (years):</label>
            <input type="number" id="duration" name="duration" [(ngModel)]="enteredDuration" required>
        </p>
    </div>
    <p>
        <button (click)="onSubmit()" >Calculate</button>
    </p>
</form>
